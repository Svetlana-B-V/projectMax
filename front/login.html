<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общак — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-logo">
        <a href="index.html" class="logo">
            <img src="logo-sber.png" alt="Общак" class="logo-img">
            <span class="logo-text">Сбер-Общак</span>
        </a>
        <h1>Общак</h1>
        <p>Совместные финансы</p>
    </div>

    <div class="auth-card">
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label>Telegram ID</label>
                <input
                        type="number"
                        id="loginEmail"
                        class="form-input"
                        placeholder="123456789"
                        required
                >
            </div>

            <div class="form-group">
                <label>Имя</label>
                <input
                        type="text"
                        id="loginPassword"
                        class="form-input"
                        placeholder="Иван"
                        required
                >
            </div>

            <button type="submit" class="btn-primary full-width">
                Войти через Telegram
            </button>
        </form>
    </div>

    <div class="auth-footer">
        <p>Есть вопросы?</p>
        <a href="https://t.me/obshchak_bot" target="_blank" class="telegram-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM17.5 8.5L15.5 16.5C15.35 17.15 14.9 17.3 14.35 17L11.5 14.9L10 16.35C9.84 16.51 9.71 16.65 9.4 16.65L9.6 13.64L15.15 8.62C15.4 8.4 15.1 8.28 14.8 8.5L8.1 12.72L5.2 11.82C4.58 11.62 4.57 11.11 5.35 10.78L17 6.3C17.54 6.08 18.02 6.42 17.85 7.14L17.5 8.5Z" fill="#21A038"/>
            </svg>
            Открыть в Telegram
        </a>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
